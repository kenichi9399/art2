<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灯 — Tomori · Amethyst Experience</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #050508;
      overflow: hidden;
      cursor: grab;
    }
    body:active { cursor: grabbing; }
    canvas { display: block; }

    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 52px 40px 44px;
    }

    .title-wrap {
      text-align: center;
      opacity: 0;
      animation: rise 4s cubic-bezier(.16, 1, .3, 1) 1.5s forwards;
    }
    .title-ja {
      font-family: 'Hiragino Mincho ProN', 'YuMincho', 'Yu Mincho', 'MS Mincho', 'Noto Serif JP', serif;
      font-size: 16px;
      font-weight: 300;
      letter-spacing: .70em;
      color: rgba(210, 150, 255, .52);
      margin-bottom: 10px;
    }
    .title-en {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: .60em;
      color: rgba(155, 90, 225, .25);
      text-transform: uppercase;
    }

    .hint {
      font-family: 'Georgia', serif;
      font-size: 9px;
      letter-spacing: .50em;
      color: rgba(130, 70, 200, .18);
      text-transform: uppercase;
      opacity: 0;
      animation: rise 3s ease-out 5s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
  </style>
</head>
<body>

  <div id="ui">
    <div class="title-wrap">
      <div class="title-ja">灯 — Tomori</div>
      <div class="title-en">生と死の共存 &nbsp;·&nbsp; Coexistence of Life and Death</div>
    </div>
    <div class="hint">drag to explore &nbsp;·&nbsp; scroll to zoom</div>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
    import { OrbitControls }   from 'https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js';
    import { EffectComposer }  from 'https://unpkg.com/three@0.158.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass }      from 'https://unpkg.com/three@0.158.0/examples/jsm/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'https://unpkg.com/three@0.158.0/examples/jsm/postprocessing/UnrealBloomPass.js';
    import { OutputPass }      from 'https://unpkg.com/three@0.158.0/examples/jsm/postprocessing/OutputPass.js';

    // ── Device capability detection ──────────────────────────────────────────
    // Mobile Safari / iOS WebGL has two critical limitations:
    //   1) MeshPhysicalMaterial.transmission needs OES_texture_float + extra
    //      render targets — silently produces black on many iOS/Android GPUs.
    //   2) EffectComposer with half-float buffers may fail on old iOS Safari.
    // Solution: detect mobile/low-end and use simpler equivalents that still
    // deliver the same aesthetic intent.
    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
      || window.innerWidth < 800;

    // ══════════════════════════════════════════════════════════════════════════
    //  RENDERER
    // ══════════════════════════════════════════════════════════════════════════
    const renderer = new THREE.WebGLRenderer({
      antialias:       !isMobile,          // MSAA off on mobile = GPU savings
      powerPreference: 'high-performance',
      alpha:           false,
    });
    renderer.setPixelRatio(isMobile ? Math.min(window.devicePixelRatio, 1.5)
                                    : Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping         = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace    = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled   = !isMobile;
    renderer.shadowMap.type      = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    // ══════════════════════════════════════════════════════════════════════════
    //  SCENE & CAMERA
    // ══════════════════════════════════════════════════════════════════════════
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050508);
    scene.fog        = new THREE.FogExp2(0x050508, 0.055);

    const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3.5, 10);

    // ══════════════════════════════════════════════════════════════════════════
    //  PROCEDURAL ENVIRONMENT MAP
    // ══════════════════════════════════════════════════════════════════════════
    (() => {
      const W = 512, H = 256;
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const cx = cv.getContext('2d');

      const base = cx.createLinearGradient(0, 0, 0, H);
      base.addColorStop(0.0, '#1c0040');
      base.addColorStop(0.4, '#0a0020');
      base.addColorStop(1.0, '#020008');
      cx.fillStyle = base;
      cx.fillRect(0, 0, W, H);

      const zenith = cx.createRadialGradient(W / 2, 0, 0, W / 2, 0, H * 0.85);
      zenith.addColorStop(0, 'rgba(178, 68, 255, 0.42)');
      zenith.addColorStop(1, 'rgba(0, 0, 0, 0)');
      cx.fillStyle = zenith;
      cx.fillRect(0, 0, W, H);

      const horizon = cx.createLinearGradient(0, H * 0.75, 0, H);
      horizon.addColorStop(0, 'rgba(0,0,0,0)');
      horizon.addColorStop(1, 'rgba(60,0,120,0.22)');
      cx.fillStyle = horizon;
      cx.fillRect(0, 0, W, H);

      const envTex      = new THREE.CanvasTexture(cv);
      envTex.mapping    = THREE.EquirectangularReflectionMapping;
      envTex.colorSpace = THREE.SRGBColorSpace;

      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();
      scene.environment = pmrem.fromEquirectangular(envTex).texture;
      pmrem.dispose();
      envTex.dispose();
    })();

    // ══════════════════════════════════════════════════════════════════════════
    //  LIGHTS
    // ══════════════════════════════════════════════════════════════════════════
    scene.add(new THREE.AmbientLight(0x150828, isMobile ? 2.0 : 0.9));

    const crystalLight = new THREE.PointLight(0xb060ff, 7.0, 14, 1.8);
    crystalLight.position.set(0, 1.8, 0);
    if (!isMobile) {
      crystalLight.castShadow         = true;
      crystalLight.shadow.mapSize.set(512, 512);
      crystalLight.shadow.camera.near = 0.1;
      crystalLight.shadow.camera.far  = 12;
    }

    const rimLight = new THREE.PointLight(0x5012b5, 1.5, 30, 2);
    rimLight.position.set(-6, 9, -6);
    scene.add(rimLight);

    const depthLight = new THREE.PointLight(0x1a0525, 0.5, 40, 2);
    depthLight.position.set(10, 1, 5);
    scene.add(depthLight);

    // Gallery spotlight — desktop only (SpotLight is expensive on mobile)
    if (!isMobile) {
      const gallerySpot = new THREE.SpotLight(0x9040e0, 2.0, 22, Math.PI * 0.16, 0.5, 2);
      gallerySpot.position.set(0, 14, 0);
      gallerySpot.target.position.set(0, 0.6, 0);
      scene.add(gallerySpot);
      scene.add(gallerySpot.target);
    } else {
      // Mobile substitute: simple top PointLight
      const topFill = new THREE.PointLight(0x8030c8, 3.5, 18, 2);
      topFill.position.set(0, 10, 0);
      scene.add(topFill);
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  AMETHYST MATERIAL
    //
    //  Desktop: full MeshPhysicalMaterial with transmission (glass refraction)
    //  Mobile:  opacity-based transparency — same visual intent, GPU-safe.
    //           transmission requires OES_texture_float + extra render pass
    //           that silently fails on many iOS/Android GPUs → black crystal.
    // ══════════════════════════════════════════════════════════════════════════
    const amethystMat = new THREE.MeshPhysicalMaterial({
      color:              new THREE.Color(0x7A2ECC),
      emissive:           new THREE.Color(0x4a00aa),
      emissiveIntensity:  isMobile ? 0.65 : 0.38,
      roughness:          0.04,
      metalness:          0.0,
      clearcoat:          0.70,
      clearcoatRoughness: 0.06,
      envMapIntensity:    isMobile ? 2.2 : 1.8,
      transparent:        true,
      opacity:            isMobile ? 0.82 : 1.0,
      ...(isMobile ? {} : {
        transmission:        0.83,
        ior:                 1.68,
        thickness:           2.8,
        attenuationColor:    new THREE.Color(0x7B2FC0),
        attenuationDistance: 2.0,
      }),
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  CRYSTAL GEOMETRY FACTORY
    // ══════════════════════════════════════════════════════════════════════════
    function makeCrystal(height, radius, sides = 6) {
      const g     = new THREE.Group();
      const bodyH = height * 0.63;
      const tipH  = height * 0.37;

      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(radius * 0.86, radius, bodyH, sides, 1),
        amethystMat,
      );
      body.position.y = bodyH * 0.5;
      if (!isMobile) body.castShadow = true;
      g.add(body);

      const tip = new THREE.Mesh(
        new THREE.ConeGeometry(radius * 0.86, tipH, sides, 1),
        amethystMat,
      );
      tip.position.y = bodyH + tipH * 0.5;
      if (!isMobile) tip.castShadow = true;
      g.add(tip);

      return g;
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  CRYSTAL CLUSTER
    // ══════════════════════════════════════════════════════════════════════════
    const cluster = new THREE.Group();

    [
      [4.6,  0.46,   0.00,  0.00,   0,     2.5,   0.8],
      [3.4,  0.36,   0.65,  0.16,  48,    11.5,   3.0],
      [2.9,  0.30,  -0.58,  0.10, -32,   -10.5,   2.2],
      [2.3,  0.24,   0.32, -0.52,  20,     6.5, -10.0],
      [1.9,  0.20,  -0.30, -0.58, -24,    -5.0,  -8.5],
      [1.45, 0.17,   0.92, -0.22,  70,    17.0,   4.5],
      [1.15, 0.14,  -0.92, -0.14, -64,   -16.0,   2.8],
      [0.90, 0.11,   0.10,  0.85,  12,     3.5,  15.0],
    ].forEach(([h, r, px, pz, ry, tz, tx]) => {
      const c = makeCrystal(h, r);
      c.position.set(px, 0, pz);
      c.rotation.y = THREE.MathUtils.degToRad(ry);
      c.rotation.z = THREE.MathUtils.degToRad(tz);
      c.rotation.x = THREE.MathUtils.degToRad(tx);
      cluster.add(c);
    });

    const rockMesh = new THREE.Mesh(
      new THREE.SphereGeometry(1.35, 9, 6),
      new THREE.MeshStandardMaterial({ color: 0x050210, roughness: 0.90, metalness: 0.04 }),
    );
    rockMesh.scale.set(1.45, 0.38, 1.45);
    rockMesh.position.y = -0.05;
    if (!isMobile) rockMesh.receiveShadow = true;
    cluster.add(rockMesh);

    cluster.add(crystalLight);
    cluster.position.set(0, 1.25, 0);
    scene.add(cluster);

    // ══════════════════════════════════════════════════════════════════════════
    //  OBSIDIAN PEDESTAL
    // ══════════════════════════════════════════════════════════════════════════
    const pedestalMat = new THREE.MeshPhysicalMaterial({
      color:              new THREE.Color(0x02010c),
      roughness:          0.04,
      metalness:          0.0,
      clearcoat:          1.0,
      clearcoatRoughness: 0.02,
      reflectivity:       1.0,
      envMapIntensity:    isMobile ? 3.5 : 2.8,
    });

    const pedestalGroup = new THREE.Group();

    [[1.55, 1.75, 0.20, 0.10],
     [0.90, 1.40, 0.32, 0.36],
     [1.02, 0.90, 0.08, 0.56]].forEach(([rt, rb, h, cy]) => {
      const m = new THREE.Mesh(
        new THREE.CylinderGeometry(rt, rb, h, 48, 1),
        pedestalMat,
      );
      m.position.y = cy;
      if (!isMobile) m.receiveShadow = true;
      pedestalGroup.add(m);
    });
    scene.add(pedestalGroup);

    // Breathing corona ring at pedestal top
    const coronaMat = new THREE.MeshBasicMaterial({
      color:       0x8030cc,
      transparent: true,
      opacity:     0.0,
      blending:    THREE.AdditiveBlending,
      depthWrite:  false,
      side:        THREE.DoubleSide,
    });
    const coronaDisc = new THREE.Mesh(
      new THREE.RingGeometry(0.88, 1.06, 64),
      coronaMat,
    );
    coronaDisc.rotation.x = -Math.PI / 2;
    coronaDisc.position.y  = 0.612;
    scene.add(coronaDisc);

    // ══════════════════════════════════════════════════════════════════════════
    //  OBSIDIAN FLOOR
    // ══════════════════════════════════════════════════════════════════════════
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.MeshStandardMaterial({
        color:           new THREE.Color(0x040207),
        roughness:       0.04,
        metalness:       0.96,
        envMapIntensity: 0.75,
      }),
    );
    floor.rotation.x = -Math.PI / 2;
    if (!isMobile) floor.receiveShadow = true;
    scene.add(floor);

    // ══════════════════════════════════════════════════════════════════════════
    //  PARTICLE SYSTEM  (fewer on mobile for performance)
    // ══════════════════════════════════════════════════════════════════════════
    const PARTICLE_COUNT = isMobile ? 300 : 520;
    const EMBER_COUNT    = Math.floor(PARTICLE_COUNT * 0.38);

    const pArr   = new Float32Array(PARTICLE_COUNT * 3);
    const pCol   = new Float32Array(PARTICLE_COUNT * 3);
    const pOriX  = new Float32Array(PARTICLE_COUNT);
    const pOriZ  = new Float32Array(PARTICLE_COUNT);
    const pVel   = new Float32Array(PARTICLE_COUNT);
    const pPhase = new Float32Array(PARTICLE_COUNT);
    const pFreq  = new Float32Array(PARTICLE_COUNT);
    const pAmp   = new Float32Array(PARTICLE_COUNT);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const isEmber = i < EMBER_COUNT;
      const angle   = Math.random() * Math.PI * 2;
      const dist    = isEmber ? 0.4 + Math.random() * 3.5
                               : 3.5 + Math.random() * 8.5;
      const ox = Math.cos(angle) * dist;
      const oz = Math.sin(angle) * dist;

      pArr[i * 3]     = ox;
      pArr[i * 3 + 1] = Math.random() * 13 - 1.5;
      pArr[i * 3 + 2] = oz;
      pOriX[i] = ox;
      pOriZ[i] = oz;
      pVel[i]   = isEmber ? 0.00070 + Math.random() * 0.00130
                           : 0.00025 + Math.random() * 0.00065;
      pPhase[i] = Math.random() * Math.PI * 2;
      pFreq[i]  = 0.18 + Math.random() * 0.48;
      pAmp[i]   = isEmber ? 0.04 + Math.random() * 0.18
                           : 0.12 + Math.random() * 0.55;

      pCol[i * 3]     = isEmber ? 0.72 : 0.38;
      pCol[i * 3 + 1] = isEmber ? 0.28 : 0.08;
      pCol[i * 3 + 2] = isEmber ? 1.00 : 0.65;
    }

    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pArr, 3));
    pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));

    scene.add(new THREE.Points(pGeo, new THREE.PointsMaterial({
      vertexColors:    true,
      size:            isMobile ? 0.030 : 0.022,
      transparent:     true,
      opacity:         isMobile ? 0.65 : 0.52,
      blending:        THREE.AdditiveBlending,
      depthWrite:      false,
      sizeAttenuation: true,
    })));

    // ══════════════════════════════════════════════════════════════════════════
    //  FLOOR HALO RINGS
    // ══════════════════════════════════════════════════════════════════════════
    [3.1, 5.6, 8.2].forEach((r, i) => {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(r, 0.011, 6, 128),
        new THREE.MeshBasicMaterial({
          color:       0x6012b0,
          transparent: true,
          opacity:     0.045 - i * 0.012,
          blending:    THREE.AdditiveBlending,
          depthWrite:  false,
        }),
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.y  = 0.008;
      scene.add(ring);
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  ORBIT CONTROLS
    // ══════════════════════════════════════════════════════════════════════════
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.2, 0);
    controls.enableDamping   = true;
    controls.dampingFactor   = 0.040;
    controls.enablePan       = false;
    controls.minDistance     = 3.5;
    controls.maxDistance     = 20;
    controls.minPolarAngle   = Math.PI * 0.07;
    controls.maxPolarAngle   = Math.PI * 0.76;
    controls.rotateSpeed     = isMobile ? 0.40 : 0.24;
    controls.zoomSpeed       = 0.38;
    controls.autoRotate      = true;
    controls.autoRotateSpeed = 0.22;

    // ══════════════════════════════════════════════════════════════════════════
    //  POST-PROCESSING
    //
    //  EffectComposer + UnrealBloomPass works on desktop and modern mobile.
    //  On older iOS/Android it may fail (half-float texture ext missing).
    //  → Build the composer inside a try/catch; fall back to direct render.
    //  Mobile uses a tighter bloom to avoid performance drop.
    // ══════════════════════════════════════════════════════════════════════════
    let bloom = null;
    let renderScene;

    try {
      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));

      bloom = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.72,                          // strength (overridden per frame)
        isMobile ? 0.55 : 0.72,        // radius — tighter on mobile
        isMobile ? 0.12 : 0.08,        // threshold
      );
      composer.addPass(bloom);
      composer.addPass(new OutputPass());

      window.addEventListener('resize', () => composer.setSize(window.innerWidth, window.innerHeight));

      // Verify the composer actually works by doing a test render
      // (errors during render will be caught in the animate loop)
      renderScene = () => composer.render();
    } catch (e) {
      // EffectComposer failed — fall back to plain renderer
      renderScene = () => renderer.render(scene, camera);
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  RESIZE
    // ══════════════════════════════════════════════════════════════════════════
    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  ANIMATION LOOP
    // ══════════════════════════════════════════════════════════════════════════
    const clock = new THREE.Clock();

    (function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      const b1      = (Math.sin(t * 0.478) + 1) * 0.5;
      const b2      = (Math.sin(t * 0.228 + 1.1) + 1) * 0.5;
      const breathe = b1 * 0.68 + b2 * 0.32;

      crystalLight.intensity         = 2.2 + breathe * 7.5;
      crystalLight.color.setHSL(0.76 + Math.sin(t * 0.087) * 0.042, 0.95, 0.64);
      amethystMat.emissiveIntensity  = (isMobile ? 0.35 : 0.10) + breathe * 0.62;

      if (bloom) bloom.strength      = 0.40 + breathe * 0.65;

      cluster.position.y             = 1.25 + Math.sin(t * 0.310) * 0.065;
      coronaMat.opacity              = 0.015 + breathe * 0.095;

      // Particle sway
      const posArr = pGeo.attributes.position.array;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const b3 = i * 3;
        posArr[b3]     = pOriX[i] + Math.sin(t * pFreq[i] + pPhase[i]) * pAmp[i];
        posArr[b3 + 2] = pOriZ[i] + Math.cos(t * pFreq[i] * 0.73 + pPhase[i] + 1.8) * pAmp[i] * 0.65;
        posArr[b3 + 1] += pVel[i];
        if (posArr[b3 + 1] > 11) {
          posArr[b3 + 1] = -1.5;
          const a = Math.random() * Math.PI * 2;
          const nd = Math.hypot(pOriX[i], pOriZ[i]) * (0.82 + Math.random() * 0.36);
          pOriX[i] = Math.cos(a) * nd;
          pOriZ[i] = Math.sin(a) * nd;
        }
      }
      pGeo.attributes.position.needsUpdate = true;

      controls.update();

      // Render with fallback safety net
      try {
        renderScene();
      } catch (e) {
        renderScene = () => renderer.render(scene, camera);
        renderScene();
      }
    })();
  </script>
</body>
</html>
