<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灯 — Tomori · Amethyst Experience</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #050508; overflow: hidden; cursor: grab; }
    body:active { cursor: grabbing; }
    canvas { display: block; }
    #ui {
      position: fixed; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; align-items: center;
      justify-content: space-between; padding: 52px 40px 44px;
    }
    .title-wrap { text-align: center; opacity: 0; animation: rise 4s cubic-bezier(.16,1,.3,1) 1.5s forwards; }
    .title-ja {
      font-family: 'Hiragino Mincho ProN','YuMincho','Yu Mincho','MS Mincho','Noto Serif JP',serif;
      font-size: 16px; font-weight: 300; letter-spacing: .70em;
      color: rgba(210,150,255,.52); margin-bottom: 10px;
    }
    .title-en {
      font-family: 'Georgia','Times New Roman',serif;
      font-size: 9px; font-weight: 400; letter-spacing: .60em;
      color: rgba(155,90,225,.25); text-transform: uppercase;
    }
    .hint {
      font-family: 'Georgia',serif; font-size: 9px; letter-spacing: .50em;
      color: rgba(130,70,200,.18); text-transform: uppercase;
      opacity: 0; animation: rise 3s ease-out 5s forwards;
    }
    @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>
  <div id="ui">
    <div class="title-wrap">
      <div class="title-ja">灯 — Tomori</div>
      <div class="title-en">生と死の共存 &nbsp;·&nbsp; Coexistence of Life and Death</div>
    </div>
    <div class="hint">drag to explore &nbsp;·&nbsp; scroll to zoom</div>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
    import { OrbitControls }   from 'https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js';
    import { EffectComposer }  from 'https://unpkg.com/three@0.158.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass }      from 'https://unpkg.com/three@0.158.0/examples/jsm/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'https://unpkg.com/three@0.158.0/examples/jsm/postprocessing/UnrealBloomPass.js';
    import { OutputPass }      from 'https://unpkg.com/three@0.158.0/examples/jsm/postprocessing/OutputPass.js';

    // ── Device detection ──────────────────────────────────────────────────────
    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
                  || window.innerWidth < 800;

    // ══════════════════════════════════════════════════════════════════════════
    //  RENDERER
    // ══════════════════════════════════════════════════════════════════════════
    const renderer = new THREE.WebGLRenderer({
      antialias:       !isMobile,
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(isMobile ? Math.min(window.devicePixelRatio, 1.5)
                                    : Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping         = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = isMobile ? 2.2 : 1.15;
    renderer.outputColorSpace    = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled   = !isMobile;
    renderer.shadowMap.type      = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    // ══════════════════════════════════════════════════════════════════════════
    //  SCENE & CAMERA
    // ══════════════════════════════════════════════════════════════════════════
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050508);
    scene.fog        = new THREE.FogExp2(0x050508, 0.045);

    const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3.5, 10);

    // ══════════════════════════════════════════════════════════════════════════
    //  ENVIRONMENT MAP  (desktop only — PMREMGenerator can fail on mobile)
    // ══════════════════════════════════════════════════════════════════════════
    if (!isMobile) {
      const W = 512, H = 256;
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const cx = cv.getContext('2d');
      const base = cx.createLinearGradient(0, 0, 0, H);
      base.addColorStop(0.0, '#1c0040');
      base.addColorStop(0.4, '#0a0020');
      base.addColorStop(1.0, '#020008');
      cx.fillStyle = base; cx.fillRect(0, 0, W, H);
      const zenith = cx.createRadialGradient(W/2,0,0,W/2,0,H*0.85);
      zenith.addColorStop(0, 'rgba(178,68,255,0.42)');
      zenith.addColorStop(1, 'rgba(0,0,0,0)');
      cx.fillStyle = zenith; cx.fillRect(0, 0, W, H);
      const envTex      = new THREE.CanvasTexture(cv);
      envTex.mapping    = THREE.EquirectangularReflectionMapping;
      envTex.colorSpace = THREE.SRGBColorSpace;
      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();
      scene.environment = pmrem.fromEquirectangular(envTex).texture;
      pmrem.dispose(); envTex.dispose();
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  LIGHTS
    //  Mobile: bright, simple, guaranteed-to-work setup
    //  Desktop: cinematic, subtle setup
    // ══════════════════════════════════════════════════════════════════════════
    if (isMobile) {
      // Strong ambient so nothing is ever black
      scene.add(new THREE.AmbientLight(0x7744aa, 4.0));

      // Main crystal glow — very bright, close range
      const ml = new THREE.PointLight(0xcc88ff, 20, 18, 1.5);
      ml.position.set(0, 4.5, 0);
      scene.add(ml);

      // Fill from front-left
      const fl = new THREE.PointLight(0x9955dd, 8, 25, 2);
      fl.position.set(-4, 6, 5);
      scene.add(fl);

      // Underlight to illuminate pedestal
      const ul = new THREE.PointLight(0x6633bb, 5, 10, 2);
      ul.position.set(0, 1.5, 0);
      scene.add(ul);
    } else {
      scene.add(new THREE.AmbientLight(0x080510, 0.9));

      const rimLight = new THREE.PointLight(0x5012b5, 1.5, 30, 2);
      rimLight.position.set(-6, 9, -6);
      scene.add(rimLight);

      const depthLight = new THREE.PointLight(0x1a0525, 0.5, 40, 2);
      depthLight.position.set(10, 1, 5);
      scene.add(depthLight);

      const gallerySpot = new THREE.SpotLight(0x9040e0, 2.0, 22, Math.PI * 0.16, 0.5, 2);
      gallerySpot.position.set(0, 14, 0);
      gallerySpot.target.position.set(0, 0.6, 0);
      scene.add(gallerySpot, gallerySpot.target);
    }

    // Breathing crystal light — added to cluster group after cluster is built
    const crystalLight = new THREE.PointLight(0xb060ff, isMobile ? 12 : 7, 14, 1.8);
    crystalLight.position.set(0, 1.8, 0);
    if (!isMobile) {
      crystalLight.castShadow = true;
      crystalLight.shadow.mapSize.set(512, 512);
      crystalLight.shadow.camera.near = 0.1;
      crystalLight.shadow.camera.far  = 12;
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  MATERIALS
    //  Mobile: MeshPhongMaterial — universally supported on all WebGL devices.
    //          MeshPhysicalMaterial (clearcoat, transmission) can silently fail
    //          on iOS/Android GPUs and render as solid black.
    //  Desktop: full MeshPhysicalMaterial pipeline.
    // ══════════════════════════════════════════════════════════════════════════
    const amethystMat = isMobile
      ? new THREE.MeshPhongMaterial({
          color:             new THREE.Color(0xa050ee),
          emissive:          new THREE.Color(0x6600cc),
          emissiveIntensity: 1.4,
          specular:          new THREE.Color(0xeeccff),
          shininess:         140,
          transparent:       true,
          opacity:           0.88,
          side:              THREE.DoubleSide,
        })
      : new THREE.MeshPhysicalMaterial({
          color:               new THREE.Color(0x6A1EAA),
          emissive:            new THREE.Color(0x38007E),
          emissiveIntensity:   0.38,
          transmission:        0.83,
          ior:                 1.68,
          roughness:           0.03,
          metalness:           0.0,
          thickness:           2.8,
          attenuationColor:    new THREE.Color(0x7B2FC0),
          attenuationDistance: 2.0,
          clearcoat:           0.55,
          clearcoatRoughness:  0.07,
          envMapIntensity:     1.7,
        });

    const pedestalMat = isMobile
      ? new THREE.MeshPhongMaterial({
          color:     new THREE.Color(0x060312),
          specular:  new THREE.Color(0x8855cc),
          shininess: 220,
        })
      : new THREE.MeshPhysicalMaterial({
          color:              new THREE.Color(0x02010c),
          roughness:          0.04,
          metalness:          0.0,
          clearcoat:          1.0,
          clearcoatRoughness: 0.02,
          reflectivity:       1.0,
          envMapIntensity:    2.8,
        });

    // ══════════════════════════════════════════════════════════════════════════
    //  CRYSTAL GEOMETRY FACTORY
    // ══════════════════════════════════════════════════════════════════════════
    function makeCrystal(height, radius, sides = 6) {
      const g = new THREE.Group();
      const bodyH = height * 0.63, tipH = height * 0.37;
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(radius * 0.86, radius, bodyH, sides, 1), amethystMat);
      body.position.y = bodyH * 0.5;
      if (!isMobile) body.castShadow = true;
      g.add(body);
      const tip = new THREE.Mesh(
        new THREE.ConeGeometry(radius * 0.86, tipH, sides, 1), amethystMat);
      tip.position.y = bodyH + tipH * 0.5;
      if (!isMobile) tip.castShadow = true;
      g.add(tip);
      return g;
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  CRYSTAL CLUSTER
    // ══════════════════════════════════════════════════════════════════════════
    const cluster = new THREE.Group();
    [
      [4.6, 0.46,  0.00,  0.00,   0,   2.5,  0.8],
      [3.4, 0.36,  0.65,  0.16,  48,  11.5,  3.0],
      [2.9, 0.30, -0.58,  0.10, -32, -10.5,  2.2],
      [2.3, 0.24,  0.32, -0.52,  20,   6.5,-10.0],
      [1.9, 0.20, -0.30, -0.58, -24,  -5.0, -8.5],
      [1.45,0.17,  0.92, -0.22,  70,  17.0,  4.5],
      [1.15,0.14, -0.92, -0.14, -64, -16.0,  2.8],
      [0.90,0.11,  0.10,  0.85,  12,   3.5, 15.0],
    ].forEach(([h, r, px, pz, ry, tz, tx]) => {
      const c = makeCrystal(h, r);
      c.position.set(px, 0, pz);
      c.rotation.set(THREE.MathUtils.degToRad(tx), THREE.MathUtils.degToRad(ry), THREE.MathUtils.degToRad(tz));
      cluster.add(c);
    });

    const rockMat = isMobile
      ? new THREE.MeshPhongMaterial({ color: 0x050210, shininess: 5 })
      : new THREE.MeshStandardMaterial({ color: 0x050210, roughness: 0.90, metalness: 0.04 });

    const rockMesh = new THREE.Mesh(new THREE.SphereGeometry(1.35, 9, 6), rockMat);
    rockMesh.scale.set(1.45, 0.38, 1.45);
    rockMesh.position.y = -0.05;
    cluster.add(rockMesh);
    cluster.add(crystalLight);
    cluster.position.set(0, 1.25, 0);
    scene.add(cluster);

    // ══════════════════════════════════════════════════════════════════════════
    //  OBSIDIAN PEDESTAL
    // ══════════════════════════════════════════════════════════════════════════
    const pedestalGroup = new THREE.Group();
    [[1.55,1.75,0.20,0.10],[0.90,1.40,0.32,0.36],[1.02,0.90,0.08,0.56]]
      .forEach(([rt,rb,h,cy]) => {
        const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,48,1), pedestalMat);
        m.position.y = cy;
        if (!isMobile) m.receiveShadow = true;
        pedestalGroup.add(m);
      });
    scene.add(pedestalGroup);

    // Corona ring (mobile: always faintly visible; desktop: breathing)
    const coronaMat = new THREE.MeshBasicMaterial({
      color: 0x8030cc, transparent: true,
      opacity: isMobile ? 0.25 : 0.0,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
    });
    const coronaDisc = new THREE.Mesh(new THREE.RingGeometry(0.88, 1.06, 64), coronaMat);
    coronaDisc.rotation.x = -Math.PI / 2;
    coronaDisc.position.y = 0.612;
    scene.add(coronaDisc);

    // ══════════════════════════════════════════════════════════════════════════
    //  FLOOR
    // ══════════════════════════════════════════════════════════════════════════
    const floorMat = isMobile
      ? new THREE.MeshPhongMaterial({ color: 0x040207, specular: 0x220044, shininess: 180 })
      : new THREE.MeshStandardMaterial({ color: 0x040207, roughness: 0.04, metalness: 0.96, envMapIntensity: 0.75 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), floorMat);
    floor.rotation.x = -Math.PI / 2;
    if (!isMobile) floor.receiveShadow = true;
    scene.add(floor);

    // ══════════════════════════════════════════════════════════════════════════
    //  PARTICLES
    // ══════════════════════════════════════════════════════════════════════════
    const PARTICLE_COUNT = isMobile ? 280 : 520;
    const EMBER_COUNT    = Math.floor(PARTICLE_COUNT * 0.38);
    const pArr   = new Float32Array(PARTICLE_COUNT * 3);
    const pCol   = new Float32Array(PARTICLE_COUNT * 3);
    const pOriX  = new Float32Array(PARTICLE_COUNT);
    const pOriZ  = new Float32Array(PARTICLE_COUNT);
    const pVel   = new Float32Array(PARTICLE_COUNT);
    const pPhase = new Float32Array(PARTICLE_COUNT);
    const pFreq  = new Float32Array(PARTICLE_COUNT);
    const pAmp   = new Float32Array(PARTICLE_COUNT);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const isEmber = i < EMBER_COUNT;
      const angle = Math.random() * Math.PI * 2;
      const dist  = isEmber ? 0.4 + Math.random() * 3.5 : 3.5 + Math.random() * 8.5;
      const ox = Math.cos(angle) * dist, oz = Math.sin(angle) * dist;
      pArr[i*3] = ox; pArr[i*3+1] = Math.random() * 13 - 1.5; pArr[i*3+2] = oz;
      pOriX[i] = ox; pOriZ[i] = oz;
      pVel[i]   = isEmber ? 0.00070 + Math.random() * 0.00130 : 0.00025 + Math.random() * 0.00065;
      pPhase[i] = Math.random() * Math.PI * 2;
      pFreq[i]  = 0.18 + Math.random() * 0.48;
      pAmp[i]   = isEmber ? 0.04 + Math.random() * 0.18 : 0.12 + Math.random() * 0.55;
      pCol[i*3]   = isEmber ? 0.80 : 0.45;
      pCol[i*3+1] = isEmber ? 0.32 : 0.10;
      pCol[i*3+2] = isEmber ? 1.00 : 0.72;
    }
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pArr, 3));
    pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));
    scene.add(new THREE.Points(pGeo, new THREE.PointsMaterial({
      vertexColors: true, size: isMobile ? 0.035 : 0.022,
      transparent: true, opacity: isMobile ? 0.75 : 0.52,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
    })));

    // ══════════════════════════════════════════════════════════════════════════
    //  FLOOR HALO RINGS
    // ══════════════════════════════════════════════════════════════════════════
    [3.1, 5.6, 8.2].forEach((r, i) => {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(r, 0.011, 6, 128),
        new THREE.MeshBasicMaterial({
          color: 0x6012b0, transparent: true,
          opacity: isMobile ? (0.12 - i * 0.03) : (0.045 - i * 0.012),
          blending: THREE.AdditiveBlending, depthWrite: false,
        }),
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.008;
      scene.add(ring);
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  ORBIT CONTROLS
    // ══════════════════════════════════════════════════════════════════════════
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.2, 0);
    controls.enableDamping   = true;  controls.dampingFactor = 0.040;
    controls.enablePan       = false;
    controls.minDistance     = 3.5;   controls.maxDistance   = 20;
    controls.minPolarAngle   = Math.PI * 0.07;
    controls.maxPolarAngle   = Math.PI * 0.76;
    controls.rotateSpeed     = isMobile ? 0.40 : 0.24;
    controls.zoomSpeed       = 0.38;
    controls.autoRotate      = true;  controls.autoRotateSpeed = 0.22;

    // ══════════════════════════════════════════════════════════════════════════
    //  POST-PROCESSING  (desktop only)
    //  Mobile uses renderer.render() directly — guaranteed to work everywhere.
    // ══════════════════════════════════════════════════════════════════════════
    let bloom = null;
    let renderScene = () => renderer.render(scene, camera);  // default fallback

    if (!isMobile) {
      try {
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        bloom = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          0.72, 0.72, 0.08,
        );
        composer.addPass(bloom);
        composer.addPass(new OutputPass());
        window.addEventListener('resize', () => composer.setSize(window.innerWidth, window.innerHeight));
        renderScene = () => composer.render();
      } catch (e) {
        // keep direct render fallback
      }
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  RESIZE
    // ══════════════════════════════════════════════════════════════════════════
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  ANIMATION LOOP
    // ══════════════════════════════════════════════════════════════════════════
    const clock = new THREE.Clock();

    (function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      const b1 = (Math.sin(t * 0.478) + 1) * 0.5;
      const b2 = (Math.sin(t * 0.228 + 1.1) + 1) * 0.5;
      const breathe = b1 * 0.68 + b2 * 0.32;

      // Breathing crystal light
      crystalLight.intensity = (isMobile ? 6 : 2.2) + breathe * (isMobile ? 14 : 7.5);
      crystalLight.color.setHSL(0.76 + Math.sin(t * 0.087) * 0.042, 0.95, 0.64);

      // Material pulse
      if (isMobile) {
        amethystMat.emissiveIntensity = 0.8 + breathe * 0.8;
      } else {
        amethystMat.emissiveIntensity = 0.10 + breathe * 0.62;
        if (bloom) bloom.strength = 0.40 + breathe * 0.65;
      }

      // Levitation
      cluster.position.y = 1.25 + Math.sin(t * 0.310) * 0.065;

      // Corona pulse
      if (!isMobile) coronaMat.opacity = 0.015 + breathe * 0.095;

      // Particle sway
      const posArr = pGeo.attributes.position.array;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const b3 = i * 3;
        posArr[b3]     = pOriX[i] + Math.sin(t * pFreq[i] + pPhase[i]) * pAmp[i];
        posArr[b3 + 2] = pOriZ[i] + Math.cos(t * pFreq[i] * 0.73 + pPhase[i] + 1.8) * pAmp[i] * 0.65;
        posArr[b3 + 1] += pVel[i];
        if (posArr[b3 + 1] > 11) {
          posArr[b3 + 1] = -1.5;
          const a = Math.random() * Math.PI * 2;
          const nd = Math.hypot(pOriX[i], pOriZ[i]) * (0.82 + Math.random() * 0.36);
          pOriX[i] = Math.cos(a) * nd; pOriZ[i] = Math.sin(a) * nd;
        }
      }
      pGeo.attributes.position.needsUpdate = true;

      controls.update();
      renderScene();
    })();
  </script>
</body>
</html>
