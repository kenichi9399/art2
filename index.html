<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灯 — Tomori · Amethyst Experience</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #050508;
      overflow: hidden;
      cursor: grab;
    }
    body:active { cursor: grabbing; }
    canvas { display: block; }

    /* ── UI Overlay ── */
    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 52px 40px 44px;
    }

    .title-wrap {
      text-align: center;
      opacity: 0;
      animation: rise 4s cubic-bezier(.16, 1, .3, 1) 1.5s forwards;
    }
    .title-ja {
      font-family: 'Hiragino Mincho ProN', 'YuMincho', 'Yu Mincho', 'MS Mincho', 'Noto Serif JP', serif;
      font-size: 16px;
      font-weight: 300;
      letter-spacing: .70em;
      color: rgba(210, 150, 255, .52);
      margin-bottom: 10px;
    }
    .title-en {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: .60em;
      color: rgba(155, 90, 225, .25);
      text-transform: uppercase;
    }

    .hint {
      font-family: 'Georgia', serif;
      font-size: 9px;
      letter-spacing: .50em;
      color: rgba(130, 70, 200, .18);
      text-transform: uppercase;
      opacity: 0;
      animation: rise 3s ease-out 5s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
  </style>
</head>
<body>

  <div id="ui">
    <div class="title-wrap">
      <div class="title-ja">灯 — Tomori</div>
      <div class="title-en">生と死の共存 &nbsp;·&nbsp; Coexistence of Life and Death</div>
    </div>
    <div class="hint">drag to explore &nbsp;·&nbsp; scroll to zoom</div>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
    import { OrbitControls }   from 'https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js';
    import { EffectComposer }  from 'https://unpkg.com/three@0.158.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass }      from 'https://unpkg.com/three@0.158.0/examples/jsm/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'https://unpkg.com/three@0.158.0/examples/jsm/postprocessing/UnrealBloomPass.js';
    import { OutputPass }      from 'https://unpkg.com/three@0.158.0/examples/jsm/postprocessing/OutputPass.js';

    // ══════════════════════════════════════════════════════════════════════════
    //  RENDERER
    // ══════════════════════════════════════════════════════════════════════════
    const renderer = new THREE.WebGLRenderer({
      antialias:       true,
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping         = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace    = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled   = true;
    renderer.shadowMap.type      = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    // ══════════════════════════════════════════════════════════════════════════
    //  SCENE & CAMERA
    // ══════════════════════════════════════════════════════════════════════════
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050508);
    scene.fog        = new THREE.FogExp2(0x050508, 0.055);

    const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3.5, 10);

    // ══════════════════════════════════════════════════════════════════════════
    //  PROCEDURAL ENVIRONMENT MAP
    //  A hand-painted violet sky used exclusively for IBL reflections on
    //  physical materials (crystal facets, obsidian pedestal surface).
    // ══════════════════════════════════════════════════════════════════════════
    (() => {
      const W = 512, H = 256;
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const cx = cv.getContext('2d');

      // Deep violet-black base
      const base = cx.createLinearGradient(0, 0, 0, H);
      base.addColorStop(0.0, '#1c0040');
      base.addColorStop(0.4, '#0a0020');
      base.addColorStop(1.0, '#020008');
      cx.fillStyle = base;
      cx.fillRect(0, 0, W, H);

      // Zenith glow — the "infinity light source" crystal facets reflect
      const zenith = cx.createRadialGradient(W / 2, 0, 0, W / 2, 0, H * 0.85);
      zenith.addColorStop(0, 'rgba(178, 68, 255, 0.40)');
      zenith.addColorStop(1, 'rgba(0, 0, 0, 0)');
      cx.fillStyle = zenith;
      cx.fillRect(0, 0, W, H);

      // Faint horizon accent — gives pedestal a hint of distant purple
      const horizon = cx.createLinearGradient(0, H * 0.75, 0, H);
      horizon.addColorStop(0, 'rgba(0,0,0,0)');
      horizon.addColorStop(1, 'rgba(60,0,120,0.20)');
      cx.fillStyle = horizon;
      cx.fillRect(0, 0, W, H);

      const envTex      = new THREE.CanvasTexture(cv);
      envTex.mapping    = THREE.EquirectangularReflectionMapping;
      envTex.colorSpace = THREE.SRGBColorSpace;

      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();
      scene.environment = pmrem.fromEquirectangular(envTex).texture;
      pmrem.dispose();
      envTex.dispose();
    })();

    // ══════════════════════════════════════════════════════════════════════════
    //  LIGHTS
    // ══════════════════════════════════════════════════════════════════════════

    // Dim fill — prevents pure-black shadows, preserves cinematic contrast
    scene.add(new THREE.AmbientLight(0x080510, 0.9));

    // PRIMARY LIGHT: inner crystal glow — "Tomori"
    //   Parented to the cluster so it levitates with the crystal.
    //   Intensity animated in the loop (breathing).
    const crystalLight = new THREE.PointLight(0xb060ff, 7.0, 14, 1.8);
    crystalLight.position.set(0, 1.8, 0);   // local to cluster group
    crystalLight.castShadow         = true;
    crystalLight.shadow.mapSize.set(512, 512);
    crystalLight.shadow.camera.near = 0.1;
    crystalLight.shadow.camera.far  = 12;
    // Will be added to cluster group after cluster is created

    // Upper-left rim — cool edge definition, static
    const rimLight = new THREE.PointLight(0x5012b5, 1.5, 30, 2);
    rimLight.position.set(-6, 9, -6);
    scene.add(rimLight);

    // Faint depth light — separates background from floor
    const depthLight = new THREE.PointLight(0x1a0525, 0.5, 40, 2);
    depthLight.position.set(10, 1, 5);
    scene.add(depthLight);

    // Downward gallery spot — theatrical cone onto the pedestal (no shadows, perf-friendly)
    const gallerySpot = new THREE.SpotLight(0x9040e0, 2.0, 22, Math.PI * 0.16, 0.5, 2);
    gallerySpot.position.set(0, 14, 0);
    gallerySpot.target.position.set(0, 0.6, 0);
    scene.add(gallerySpot);
    scene.add(gallerySpot.target);

    // ══════════════════════════════════════════════════════════════════════════
    //  AMETHYST MATERIAL  (MeshPhysicalMaterial — the heart of the piece)
    //
    //  transmission + ior → glass-like refraction bends light inside the crystal
    //  clearcoat         → a second specular layer for the polished facet sheen
    //  attenuationColor  → deep purple saturation accumulates with depth
    // ══════════════════════════════════════════════════════════════════════════
    const amethystMat = new THREE.MeshPhysicalMaterial({
      color:               new THREE.Color(0x6A1EAA),
      emissive:            new THREE.Color(0x38007E),
      emissiveIntensity:   0.38,
      transmission:        0.83,
      ior:                 1.68,
      roughness:           0.03,
      metalness:           0.0,
      thickness:           2.8,
      attenuationColor:    new THREE.Color(0x7B2FC0),
      attenuationDistance: 2.0,
      clearcoat:           0.55,
      clearcoatRoughness:  0.07,
      envMapIntensity:     1.7,
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  CRYSTAL GEOMETRY FACTORY
    //  Hexagonal prism body (CylinderGeometry, 6 sides) +
    //  pyramidal termination (ConeGeometry, 6 sides) = realistic quartz spike
    // ══════════════════════════════════════════════════════════════════════════
    function makeCrystal(height, radius, sides = 6) {
      const g     = new THREE.Group();
      const bodyH = height * 0.63;
      const tipH  = height * 0.37;

      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(radius * 0.86, radius, bodyH, sides, 1),
        amethystMat,
      );
      body.position.y = bodyH * 0.5;
      body.castShadow = true;
      g.add(body);

      const tip = new THREE.Mesh(
        new THREE.ConeGeometry(radius * 0.86, tipH, sides, 1),
        amethystMat,
      );
      tip.position.y = bodyH + tipH * 0.5;
      tip.castShadow = true;
      g.add(tip);

      return g;
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  CRYSTAL CLUSTER  (8 spikes of varying scale + raw matrix rock)
    // ══════════════════════════════════════════════════════════════════════════
    const cluster = new THREE.Group();

    // [height, radius,  px,    pz,   rotY°, tiltZ°, tiltX°]
    [
      [4.6,  0.46,   0.00,  0.00,   0,     2.5,   0.8],
      [3.4,  0.36,   0.65,  0.16,  48,    11.5,   3.0],
      [2.9,  0.30,  -0.58,  0.10, -32,   -10.5,   2.2],
      [2.3,  0.24,   0.32, -0.52,  20,     6.5, -10.0],
      [1.9,  0.20,  -0.30, -0.58, -24,    -5.0,  -8.5],
      [1.45, 0.17,   0.92, -0.22,  70,    17.0,   4.5],
      [1.15, 0.14,  -0.92, -0.14, -64,   -16.0,   2.8],
      [0.90, 0.11,   0.10,  0.85,  12,     3.5,  15.0],
    ].forEach(([h, r, px, pz, ry, tz, tx]) => {
      const c = makeCrystal(h, r);
      c.position.set(px, 0, pz);
      c.rotation.y = THREE.MathUtils.degToRad(ry);
      c.rotation.z = THREE.MathUtils.degToRad(tz);
      c.rotation.x = THREE.MathUtils.degToRad(tx);
      cluster.add(c);
    });

    // Raw mineral matrix — the rough dark rock the spikes grow from
    const rockMesh = new THREE.Mesh(
      new THREE.SphereGeometry(1.35, 9, 6),
      new THREE.MeshStandardMaterial({ color: 0x050210, roughness: 0.90, metalness: 0.04 }),
    );
    rockMesh.scale.set(1.45, 0.38, 1.45);
    rockMesh.position.y = -0.05;
    rockMesh.receiveShadow = true;
    cluster.add(rockMesh);

    // The crystal light travels with the cluster (levitates together)
    cluster.add(crystalLight);

    // Elevated to rest on pedestal top (y≈0.60). Float amplitude ±0.065
    // ensures the rock base never clips into the pedestal surface.
    cluster.position.set(0, 1.25, 0);
    scene.add(cluster);

    // ══════════════════════════════════════════════════════════════════════════
    //  OBSIDIAN PEDESTAL  (NEW)
    //
    //  3-tier stacked cylinder architecture:
    //    Tier 1 — base plinth  (widest, shallowest)
    //    Tier 2 — middle shaft  (tapered frustum)
    //    Tier 3 — top cap       (narrowest, thinnest — the "stage" for crystal)
    //
    //  Material: MeshPhysicalMaterial with clearcoat = 1.0 → near-mirror surface
    //  that reflects both the environment map and the crystal's point light.
    // ══════════════════════════════════════════════════════════════════════════
    const pedestalMat = new THREE.MeshPhysicalMaterial({
      color:              new THREE.Color(0x02010c),  // blackest obsidian, faint blue
      roughness:          0.04,                        // near-mirror base layer
      metalness:          0.0,                         // obsidian is vitreous, not metallic
      clearcoat:          1.0,                         // full clearcoat — the glassy sheen
      clearcoatRoughness: 0.02,                        // almost perfectly specular
      reflectivity:       1.0,
      envMapIntensity:    2.8,                         // boost env reflection for drama
    });

    const pedestalGroup = new THREE.Group();

    // Tier 1 — base plinth: top at y = 0.20
    const tier1 = new THREE.Mesh(
      new THREE.CylinderGeometry(1.55, 1.75, 0.20, 48, 1),
      pedestalMat,
    );
    tier1.position.y = 0.10;
    tier1.receiveShadow = true;
    pedestalGroup.add(tier1);

    // Tier 2 — middle shaft: bottom at y = 0.20, top at y = 0.52
    const tier2 = new THREE.Mesh(
      new THREE.CylinderGeometry(0.90, 1.40, 0.32, 48, 1),
      pedestalMat,
    );
    tier2.position.y = 0.36;
    tier2.receiveShadow = true;
    pedestalGroup.add(tier2);

    // Tier 3 — top cap: bottom at y = 0.52, top at y = 0.60
    const tier3 = new THREE.Mesh(
      new THREE.CylinderGeometry(1.02, 0.90, 0.08, 48, 1),
      pedestalMat,
    );
    tier3.position.y = 0.56;
    tier3.receiveShadow = true;
    pedestalGroup.add(tier3);

    scene.add(pedestalGroup);

    // Glow corona ring at the pedestal's top edge —
    // a breath of light seeping from the crystal down onto the stone
    const coronaMat = new THREE.MeshBasicMaterial({
      color:       0x7020b8,
      transparent: true,
      opacity:     0.0,          // driven by breathing animation
      blending:    THREE.AdditiveBlending,
      depthWrite:  false,
      side:        THREE.DoubleSide,
    });
    const coronaDisc = new THREE.Mesh(
      new THREE.RingGeometry(0.88, 1.06, 64),
      coronaMat,
    );
    coronaDisc.rotation.x = -Math.PI / 2;
    coronaDisc.position.y  = 0.612;         // fractionally above top surface
    scene.add(coronaDisc);

    // ══════════════════════════════════════════════════════════════════════════
    //  OBSIDIAN FLOOR
    // ══════════════════════════════════════════════════════════════════════════
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.MeshStandardMaterial({
        color:           new THREE.Color(0x040207),
        roughness:       0.04,
        metalness:       0.96,
        envMapIntensity: 0.75,
      }),
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // ══════════════════════════════════════════════════════════════════════════
    //  PARTICLE SYSTEM  (NEW — organic two-population field)
    //
    //  Population A (40%): "embers" — dense, brighter, close to the crystal.
    //    These represent life force — the sparks of existence rising from stone.
    //    Faster rise, subtle sway.
    //
    //  Population B (60%): "dust" — sparse, dimmer, ambient outer field.
    //    These represent the silence beyond — slow drift, wider sway.
    //
    //  Per-particle data drives independent sine-wave sway on x/z axes,
    //  giving each mote its own personality in the invisible current.
    // ══════════════════════════════════════════════════════════════════════════
    const PARTICLE_COUNT = 520;
    const EMBER_COUNT    = Math.floor(PARTICLE_COUNT * 0.38);  // 38% embers

    const pArr   = new Float32Array(PARTICLE_COUNT * 3);  // positions
    const pCol   = new Float32Array(PARTICLE_COUNT * 3);  // vertex colours
    const pOriX  = new Float32Array(PARTICLE_COUNT);      // sway origin X
    const pOriZ  = new Float32Array(PARTICLE_COUNT);      // sway origin Z
    const pVel   = new Float32Array(PARTICLE_COUNT);      // rise speed
    const pPhase = new Float32Array(PARTICLE_COUNT);      // sway phase offset
    const pFreq  = new Float32Array(PARTICLE_COUNT);      // sway frequency
    const pAmp   = new Float32Array(PARTICLE_COUNT);      // sway amplitude

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const isEmber = i < EMBER_COUNT;
      const angle   = Math.random() * Math.PI * 2;
      const dist    = isEmber
        ? 0.4 + Math.random() * 3.5          // embers: tight halo 0.4–3.9 r
        : 3.5 + Math.random() * 8.5;         // dust:   wide field  3.5–12 r

      const ox = Math.cos(angle) * dist;
      const oz = Math.sin(angle) * dist;

      pArr[i * 3]     = ox;
      pArr[i * 3 + 1] = Math.random() * 13 - 1.5;
      pArr[i * 3 + 2] = oz;

      pOriX[i]  = ox;
      pOriZ[i]  = oz;
      pVel[i]   = isEmber
        ? 0.00070 + Math.random() * 0.00130  // embers rise faster
        : 0.00025 + Math.random() * 0.00065; // dust drifts slowly

      pPhase[i] = Math.random() * Math.PI * 2;
      pFreq[i]  = 0.18 + Math.random() * 0.48;
      pAmp[i]   = isEmber
        ? 0.04 + Math.random() * 0.18        // embers: tight organic wobble
        : 0.12 + Math.random() * 0.55;       // dust:   wide wind-like sway

      // Vertex colour — embers: bright violet-white; dust: dim purple
      if (isEmber) {
        pCol[i * 3]     = 0.72;   // r
        pCol[i * 3 + 1] = 0.28;   // g
        pCol[i * 3 + 2] = 1.00;   // b  → vivid violet
      } else {
        pCol[i * 3]     = 0.38;
        pCol[i * 3 + 1] = 0.08;
        pCol[i * 3 + 2] = 0.65;   // → muted purple
      }
    }

    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pArr,  3));
    pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol,  3));

    const dust = new THREE.Points(pGeo, new THREE.PointsMaterial({
      vertexColors: true,
      size:         0.022,
      transparent:  true,
      opacity:      0.52,
      blending:     THREE.AdditiveBlending,
      depthWrite:   false,
      sizeAttenuation: true,
    }));
    scene.add(dust);

    // ══════════════════════════════════════════════════════════════════════════
    //  FLOOR HALO RINGS  (radiant circles on obsidian — energy spreading out)
    // ══════════════════════════════════════════════════════════════════════════
    [3.1, 5.6, 8.2].forEach((r, i) => {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(r, 0.011, 6, 128),
        new THREE.MeshBasicMaterial({
          color:       0x6012b0,
          transparent: true,
          opacity:     0.045 - i * 0.012,
          blending:    THREE.AdditiveBlending,
          depthWrite:  false,
        }),
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.y  = 0.008;
      scene.add(ring);
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  ORBIT CONTROLS
    // ══════════════════════════════════════════════════════════════════════════
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.2, 0);
    controls.enableDamping   = true;
    controls.dampingFactor   = 0.040;
    controls.enablePan       = false;
    controls.minDistance     = 3.5;
    controls.maxDistance     = 20;
    controls.minPolarAngle   = Math.PI * 0.07;
    controls.maxPolarAngle   = Math.PI * 0.76;
    controls.rotateSpeed     = 0.24;
    controls.zoomSpeed       = 0.38;
    controls.autoRotate      = true;
    controls.autoRotateSpeed = 0.22;

    // ══════════════════════════════════════════════════════════════════════════
    //  POST-PROCESSING  — UnrealBloomPass calibration
    //
    //  Goal: the crystal's transmitted light "bleeds" into the surrounding fog
    //  in a way that evokes a lantern glimpsed through dense night mist.
    //  Not an explosion of light — a quiet, cinematic seep.
    //
    //  threshold: 0.08  → catches the faint emissive glow in addition to hot spots
    //  radius:    0.72  → wide, soft diffusion (fog-like scatter)
    //  strength:  0.40→1.05 (animated with breathing)
    // ══════════════════════════════════════════════════════════════════════════
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.72,   // strength (start value; overridden each frame)
      0.72,   // radius   — generous soft scatter
      0.08,   // threshold — includes the quiet emissive glow
    );
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    // ══════════════════════════════════════════════════════════════════════════
    //  RESIZE
    // ══════════════════════════════════════════════════════════════════════════
    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
    });

    // ══════════════════════════════════════════════════════════════════════════
    //  ANIMATION LOOP — the living pulse of "Tomori"
    // ══════════════════════════════════════════════════════════════════════════
    const clock = new THREE.Clock();

    (function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // ── Organic breathing rhythm ──────────────────────────────────────────
      //  Two overlapping sine waves produce a breath that never feels mechanical:
      //  b1 (~4.2s) = the primary inhalation/exhalation cycle
      //  b2 (~8.7s) = a slower undercurrent — the deeper pulse of stone
      const b1      = (Math.sin(t * 0.478) + 1) * 0.5;
      const b2      = (Math.sin(t * 0.228 + 1.1) + 1) * 0.5;
      const breathe = b1 * 0.68 + b2 * 0.32;            // 0 → 1

      // ── Crystal inner light ───────────────────────────────────────────────
      crystalLight.intensity = 2.2 + breathe * 7.5;
      // Slow hue drift: deep violet → indigo-purple and back (~70s full cycle)
      crystalLight.color.setHSL(
        0.76 + Math.sin(t * 0.087) * 0.042,
        0.95,
        0.64,
      );

      // ── Material self-illumination ────────────────────────────────────────
      amethystMat.emissiveIntensity = 0.10 + breathe * 0.62;

      // ── Bloom: cinematic glow seep synced to breathing ────────────────────
      //   At rest (breathe=0): strength 0.40 — quiet, barely-there haze
      //   At peak (breathe=1): strength 1.05 — luminous bloom fills the fog
      bloom.strength = 0.40 + breathe * 0.65;

      // ── Cluster levitation ────────────────────────────────────────────────
      //   Different period (0.310) from breathing to prevent lockstep feeling
      cluster.position.y = 1.25 + Math.sin(t * 0.310) * 0.065;

      // ── Pedestal corona — breathing ring at the crystal's base ───────────
      coronaMat.opacity = 0.015 + breathe * 0.095;

      // ── Particle field: rise + organic sway ──────────────────────────────
      //   Each particle oscillates on x/z via its own phase and frequency,
      //   giving the field a wind-swept, living quality.
      const posArr = pGeo.attributes.position.array;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const base3 = i * 3;

        // Two-axis sway: x and z use different frequency ratios to avoid
        // the field moving in lockstep (0.73× ratio = pleasantly irrational)
        posArr[base3]     = pOriX[i]
          + Math.sin(t * pFreq[i] + pPhase[i]) * pAmp[i];
        posArr[base3 + 2] = pOriZ[i]
          + Math.cos(t * pFreq[i] * 0.73 + pPhase[i] + 1.8) * pAmp[i] * 0.65;

        // Rise; wrap back to just below ground when out of frame
        posArr[base3 + 1] += pVel[i];
        if (posArr[base3 + 1] > 11) {
          posArr[base3 + 1] = -1.5;
          // Slightly shift the sway origin on reset → the field slowly evolves
          const a = Math.random() * Math.PI * 2;
          const d = Math.hypot(pOriX[i], pOriZ[i]);
          const nd = d * (0.82 + Math.random() * 0.36);
          pOriX[i] = Math.cos(a) * nd;
          pOriZ[i] = Math.sin(a) * nd;
        }
      }
      pGeo.attributes.position.needsUpdate = true;

      controls.update();
      composer.render();
    })();
  </script>
</body>
</html>
